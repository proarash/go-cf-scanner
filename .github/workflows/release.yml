name: Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: write

jobs:

  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build
      run: sh scripts/build.sh

    - name: Checksums
      run: cd out && sha256sum cf-scanner-* > checksums.txt

    # GitHub's generated notes first, then the download table from .github/release-template.md
    - name: Release notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body > notes.md
        printf '\n\n' >> notes.md
        sed -e "s|{{TAG}}|$GITHUB_REF_NAME|g" -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" .github/release-template.md >> notes.md

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        body_path: notes.md
        files: out/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
